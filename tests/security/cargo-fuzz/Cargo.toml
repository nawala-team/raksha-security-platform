[package]
name = "raksha-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# Reference the workspace crates to fuzz
# Uncomment and adjust paths as crates are developed:
# raksha-core = { path = "../../../crates/raksha-core" }
# raksha-parser = { path = "../../../crates/raksha-parser" }

[workspace]
members = ["."]

[[bin]]
name = "parse_input"
path = "fuzz_targets/parse_input.rs"
doc = false

[[bin]]
name = "parse_config"
path = "fuzz_targets/parse_config.rs"
doc = false

[[bin]]
name = "parse_rule"
path = "fuzz_targets/parse_rule.rs"
doc = false

# Recommended: keep optimizations for fuzzing performance
[profile.release]
debug = 1
opt-level = 3

# Address sanitizer catches more bugs but is slower
[profile.dev]
opt-level = 1

[package]
name = "raksha-threat-intel"
version = "1.3.0"
edition = "2021"
description = "Threat intelligence feed management and IOC correlation"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
anyhow = "1"

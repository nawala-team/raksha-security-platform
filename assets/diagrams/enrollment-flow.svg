<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg2)" rx="12"/>
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="14" font-weight="bold">AGENT ENROLLMENT FLOW</text>
  <rect x="50" y="60" width="160" height="50" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
  <text x="130" y="82" text-anchor="middle" fill="#0ea5e9" font-family="monospace" font-size="11">1. Admin</text>
  <text x="130" y="98" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Generate Token</text>
  <line x1="210" y1="85" x2="270" y2="85" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="60" width="160" height="50" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
  <text x="350" y="82" text-anchor="middle" fill="#6366f1" font-family="monospace" font-size="11">2. Portal</text>
  <text x="350" y="98" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">rkat_org_xxx...</text>
  <line x1="430" y1="85" x2="490" y2="85" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="490" y="60" width="160" height="50" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="570" y="82" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11">3. Install Cmd</text>
  <text x="570" y="98" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Copy to Server</text>
  <line x1="650" y1="85" x2="710" y2="85" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="710" y="60" width="160" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="790" y="82" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11">4. Agent</text>
  <text x="790" y="98" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Sends Fingerprint</text>
  <line x1="790" y1="110" x2="790" y2="150" stroke="#10b981" stroke-width="1.5"/>
  <rect x="610" y="150" width="260" height="50" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="740" y="172" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11">5. Portal Validates</text>
  <text x="740" y="188" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Token + Fingerprint + Org</text>
  <line x1="610" y1="175" x2="550" y2="175" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="350" y="150" width="200" height="50" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
  <text x="450" y="172" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="11">6. Issue mTLS Cert</text>
  <text x="450" y="188" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">30-day certificate</text>
  <line x1="350" y1="175" x2="290" y2="175" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="80" y="150" width="210" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="185" y="172" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11">7. Agent Online</text>
  <text x="185" y="188" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Encrypted Reporting</text>
  <circle cx="80" cy="175" r="4" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="240" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold">MULTI-TENANT ISOLATION</text>
  <rect x="50" y="260" width="250" height="60" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="175" y="282" text-anchor="middle" fill="#0ea5e9" font-family="monospace" font-size="10">Company A</text>
  <text x="175" y="298" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Portal A + DB A + CA A</text>
  <text x="175" y="312" text-anchor="middle" fill="#334155" font-family="monospace" font-size="8">raksha.company-a.com</text>
  <rect x="325" y="260" width="250" height="60" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="282" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="10">Company B</text>
  <text x="450" y="298" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Portal B + DB B + CA B</text>
  <text x="450" y="312" text-anchor="middle" fill="#334155" font-family="monospace" font-size="8">raksha.company-b.com</text>
  <rect x="600" y="260" width="250" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="725" y="282" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10">Company C</text>
  <text x="725" y="298" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Portal C + DB C + CA C</text>
  <text x="725" y="312" text-anchor="middle" fill="#334155" font-family="monospace" font-size="8">security.company-c.io</text>
  <text x="450" y="350" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="10">X NO CROSS-TALK X</text>
  <text x="450" y="370" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Each portal has its own CA - certificates are incompatible across portals</text>
  <line x1="300" y1="340" x2="325" y2="340" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
  <line x1="575" y1="340" x2="600" y2="340" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <rect width="800" height="250" fill="#0f172a" rx="12"/>
  <text x="400" y="28" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="bold">MULTI-CHANNEL NOTIFICATION SYSTEM</text>
  <rect x="280" y="50" width="240" height="50" fill="#1e293b" rx="8" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="72" text-anchor="middle" fill="#fca5a5" font-family="system-ui" font-size="11" font-weight="bold">Alert Engine (Rust)</text>
  <text x="400" y="88" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="8">Dedup + Throttle + Priority Queue</text>
  <line x1="320" y1="100" x2="130" y2="130" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"><animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/></line>
  <line x1="400" y1="100" x2="400" y2="130" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"><animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite" begin="0.3s"/></line>
  <line x1="480" y1="100" x2="670" y2="130" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"><animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite" begin="0.6s"/></line>
  <rect x="40" y="130" width="180" height="105" fill="#1e293b" rx="8" stroke="#3b82f6"/>
  <text x="130" y="152" text-anchor="middle" fill="#93c5fd" font-family="system-ui" font-size="10" font-weight="bold">Email (SMTP)</text>
  <text x="60" y="172" fill="#64748b" font-family="system-ui" font-size="8">Requires: SMTP server</text>
  <text x="60" y="188" fill="#64748b" font-family="system-ui" font-size="8">Library: lettre (Rust)</text>
  <text x="60" y="204" fill="#64748b" font-family="system-ui" font-size="8">TLS: STARTTLS/SSL</text>
  <text x="60" y="220" fill="#64748b" font-family="system-ui" font-size="8">HTML + Plain text</text>
  <rect x="310" y="130" width="180" height="105" fill="#1e293b" rx="8" stroke="#8b5cf6"/>
  <text x="400" y="152" text-anchor="middle" fill="#c4b5fd" font-family="system-ui" font-size="10" font-weight="bold">Telegram Bot</text>
  <text x="330" y="172" fill="#64748b" font-family="system-ui" font-size="8">Requires: Bot Token</text>
  <text x="330" y="188" fill="#64748b" font-family="system-ui" font-size="8">API: Bot HTTP API</text>
  <text x="330" y="204" fill="#64748b" font-family="system-ui" font-size="8">Format: Markdown</text>
  <text x="330" y="220" fill="#64748b" font-family="system-ui" font-size="8">Group + Channel</text>
  <rect x="580" y="130" width="180" height="105" fill="#1e293b" rx="8" stroke="#10b981"/>
  <text x="670" y="152" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="10" font-weight="bold">Webhook</text>
  <text x="600" y="172" fill="#64748b" font-family="system-ui" font-size="8">Custom HTTP POST</text>
  <text x="600" y="188" fill="#64748b" font-family="system-ui" font-size="8">JSON payload</text>
  <text x="600" y="204" fill="#64748b" font-family="system-ui" font-size="8">HMAC signature</text>
  <text x="600" y="220" fill="#64748b" font-family="system-ui" font-size="8">Retry with backoff</text>
</svg>

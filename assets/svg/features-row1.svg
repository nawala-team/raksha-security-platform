<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#1a1a2e"/><stop offset="100%" style="stop-color:#16213e"/></linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#7c3aed"/><stop offset="100%" style="stop-color:#a855f7"/></linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#06b6d4"/><stop offset="100%" style="stop-color:#22d3ee"/></linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#10b981"/><stop offset="100%" style="stop-color:#34d399"/></linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f59e0b"/><stop offset="100%" style="stop-color:#fbbf24"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <g transform="translate(10,10)"><rect width="210" height="240" rx="12" fill="url(#cardBg)" filter="url(#shadow)"/><rect width="210" height="3" rx="1.5" fill="url(#purple)"/><g transform="translate(75,35)"><rect x="0" y="10" width="60" height="45" rx="5" fill="none" stroke="url(#purple)" stroke-width="2.5"/><rect x="5" y="15" width="50" height="30" rx="2" fill="none" stroke="#a855f7" stroke-width="1.5"/><circle cx="30" cy="60" r="3" fill="#a855f7"/></g><text x="105" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Server Monitor</text><text x="105" y="140" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">Real-time server health,</text><text x="105" y="155" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">resource utilization, and</text><text x="105" y="170" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">anomaly detection</text></g>
  <g transform="translate(230,10)"><rect width="210" height="240" rx="12" fill="url(#cardBg)" filter="url(#shadow)"/><rect width="210" height="3" rx="1.5" fill="url(#cyan)"/><g transform="translate(75,35)"><circle cx="30" cy="30" r="25" fill="none" stroke="url(#cyan)" stroke-width="2.5"/><circle cx="30" cy="30" r="15" fill="none" stroke="#22d3ee" stroke-width="1.5"/><circle cx="30" cy="30" r="5" fill="#06b6d4"/><line x1="48" y1="48" x2="58" y2="58" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/></g><text x="105" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Network Scanner</text><text x="105" y="140" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">Port scanning, vulnerability</text><text x="105" y="155" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">assessment, and topology</text><text x="105" y="170" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">mapping</text></g>
  <g transform="translate(450,10)"><rect width="210" height="240" rx="12" fill="url(#cardBg)" filter="url(#shadow)"/><rect width="210" height="3" rx="1.5" fill="url(#green)"/><g transform="translate(75,35)"><ellipse cx="30" cy="15" rx="25" ry="10" fill="none" stroke="url(#green)" stroke-width="2.5"/><path d="M5 15 L5 45 Q5 55 30 55 Q55 55 55 45 L55 15" fill="none" stroke="#10b981" stroke-width="2.5"/><ellipse cx="30" cy="30" rx="25" ry="8" fill="none" stroke="#34d399" stroke-width="1"/></g><text x="105" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Database Guard</text><text x="105" y="140" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">Multi-DB security:</text><text x="105" y="155" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">PostgreSQL, MySQL, MongoDB,</text><text x="105" y="170" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">Oracle, Redis, MariaDB</text></g>
  <g transform="translate(670,10)"><rect width="210" height="240" rx="12" fill="url(#cardBg)" filter="url(#shadow)"/><rect width="210" height="3" rx="1.5" fill="url(#orange)"/><g transform="translate(75,35)"><rect x="5" y="5" width="50" height="55" rx="3" fill="none" stroke="url(#orange)" stroke-width="2.5"/><line x1="15" y1="20" x2="45" y2="20" stroke="#fbbf24" stroke-width="2"/><line x1="15" y1="32" x2="45" y2="32" stroke="#fbbf24" stroke-width="2"/><line x1="15" y1="44" x2="35" y2="44" stroke="#fbbf24" stroke-width="2"/><path d="M38 42 L42 48 L52 35" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/></g><text x="105" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Compliance Engine</text><text x="105" y="140" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">Automated checks against</text><text x="105" y="155" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">CIS, NIST, PCI-DSS,</text><text x="105" y="170" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">ISO 27001</text></g>
</svg>

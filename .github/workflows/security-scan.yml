name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: Cargo Audit (Rust CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --json | tee audit-results.json
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-results
          path: audit-results.json

  cargo-deny:
    name: Cargo Deny (Licenses & Advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked
      - run: cargo deny check advisories
      - run: cargo deny check licenses
      - run: cargo deny check bans
      - run: cargo deny check sources

  clippy-security:
    name: Clippy Security Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run security-focused clippy lints
        run: |
          cargo clippy --all-targets --all-features -- \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic \
            -W clippy::indexing_slicing \
            -W clippy::arithmetic_side_effects \
            -D warnings

  trivy-container:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'docker')
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t raksha-security-platform:scan .
          else
            echo "No Dockerfile found, skipping"
            exit 0
          fi
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'raksha-security-platform:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy FS results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs-results.sarif'


  npm-audit:
    name: NPM Audit (Node.js CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for package.json
        id: check-npm
        run: |
          if find . -name "package.json" -not -path "*/node_modules/*" | grep -q .; then
            echo "has_npm=true" >> $GITHUB_OUTPUT
          else
            echo "has_npm=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Node.js
        if: steps.check-npm.outputs.has_npm == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run npm audit
        if: steps.check-npm.outputs.has_npm == 'true'
        run: |
          find . -name "package.json" -not -path "*/node_modules/*" -execdir sh -c '
            echo "Auditing: $(pwd)"
            if [ -f package-lock.json ]; then
              npm audit --audit-level=high || true
            else
              npm install --package-lock-only
              npm audit --audit-level=high || true
            fi
          ' \;
      - name: Skip - no Node.js projects
        if: steps.check-npm.outputs.has_npm == 'false'
        run: echo "No package.json found, skipping npm audit"

  python-safety:
    name: Python Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Python dependencies
        id: check-python
        run: |
          if find . -name "requirements*.txt" -o -name "Pipfile.lock" -o -name "poetry.lock" | grep -q .; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Python
        if: steps.check-python.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        if: steps.check-python.outputs.has_python == 'true'
        run: pip install pip-audit
      - name: Run pip-audit
        if: steps.check-python.outputs.has_python == 'true'
        run: |
          find . -name "requirements*.txt" -exec sh -c '
            echo "Auditing: {}"
            pip-audit -r "{}" --desc || true
          ' \;
      - name: Skip - no Python projects
        if: steps.check-python.outputs.has_python == 'false'
        run: echo "No Python dependency files found, skipping"

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ""


  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs:
      - cargo-audit
      - cargo-deny
      - clippy-security
      - trivy-fs
      - npm-audit
      - python-safety
      - gitleaks
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo Audit | ${{ needs.cargo-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo Deny | ${{ needs.cargo-deny.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clippy Security | ${{ needs.clippy-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy FS | ${{ needs.trivy-fs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Safety | ${{ needs.python-safety.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
      - name: Fail if critical checks failed
        if: |
          needs.cargo-audit.result == 'failure' ||
          needs.cargo-deny.result == 'failure' ||
          needs.gitleaks.result == 'failure'
        run: |
          echo "Critical security checks failed!"
          exit 1


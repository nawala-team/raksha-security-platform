x-common-env: &common-env
  RUST_LOG: info
  DATABASE_URL: postgres://raksha:${POSTGRES_PASSWORD}@postgres:5432/raksha
  REDIS_URL: redis://redis:6379
  TIMESCALE_URL: postgres://raksha:${POSTGRES_PASSWORD}@timescaledb:5432/raksha_metrics
  OPENSEARCH_URL: http://opensearch:9200

x-siem-env: &siem-env
  SIEM_ENABLED: ${SIEM_ENABLED:-false}
  SIEM_TARGET: ${SIEM_TARGET:-splunk}
  SIEM_HOST: ${SIEM_HOST:-}
  SIEM_PORT: ${SIEM_PORT:-}
  SIEM_TOKEN: ${SIEM_TOKEN:-}
  SIEM_FORMAT: ${SIEM_FORMAT:-cef}
  SIEM_TLS_ENABLED: ${SIEM_TLS_ENABLED:-true}
  SIEM_TLS_VERIFY: ${SIEM_TLS_VERIFY:-true}
  SIEM_FLUSH_INTERVAL: ${SIEM_FLUSH_INTERVAL:-5s}
  SIEM_BUFFER_SIZE: ${SIEM_BUFFER_SIZE:-256}

services:
  # ─── Portal API (Rust/Axum) ────────────────────────────────────────
  portal:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.portal
    image: raksha/portal:${RAKSHA_VERSION:-latest}
    container_name: raksha-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    environment:
      <<: *common-env
      SIEM_ENABLED: ${SIEM_ENABLED:-false}
      SIEM_TARGET: ${SIEM_TARGET:-splunk}
      SIEM_HOST: ${SIEM_HOST:-}
      SIEM_PORT: ${SIEM_PORT:-}
      SIEM_TOKEN: ${SIEM_TOKEN:-}
      SIEM_FORMAT: ${SIEM_FORMAT:-cef}
      SIEM_TLS_ENABLED: ${SIEM_TLS_ENABLED:-true}
      SIEM_TLS_VERIFY: ${SIEM_TLS_VERIFY:-true}
      SIEM_FLUSH_INTERVAL: ${SIEM_FLUSH_INTERVAL:-5s}
      SIEM_BUFFER_SIZE: ${SIEM_BUFFER_SIZE:-256}
      JWT_SECRET: ${JWT_SECRET}
      PORTAL_HOST: 0.0.0.0
      PORTAL_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "raksha.portal"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raksha-net

  # ─── Web UI (Next.js) ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        # Baked into the build: next.config.js resolves rewrites() at build time.
        # Inside the compose network the portal is always reachable as `portal`,
        # so this is intentionally not taken from .env (a local value such as
        # http://localhost:8080 would be unreachable from this container).
        PORTAL_API_URL: http://portal:8080
    image: raksha/web:${RAKSHA_VERSION:-latest}
    container_name: raksha-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      PORTAL_API_URL: http://portal:8080
      NODE_ENV: production
    depends_on:
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raksha-net

  # ─── ML Engine (Python) ────────────────────────────────────────────
  ml-trainer:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.ml
    image: raksha/ml-engine:${RAKSHA_VERSION:-latest}
    container_name: raksha-ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      <<: *common-env
      MODEL_STORAGE: /data/models
      PORTAL_API_URL: http://portal:8080
    volumes:
      - ml-models:/data/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - raksha-net

  # ─── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: raksha-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: raksha
      POSTGRES_USER: raksha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksha -d raksha"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - raksha-net

  # ─── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: raksha-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - raksha-net

  # ─── TimescaleDB (metrics time-series) ─────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: raksha-timescaledb
    restart: unless-stopped
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: raksha_metrics
      POSTGRES_USER: raksha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksha -d raksha_metrics"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - raksha-net

  # ─── OpenSearch (log indexing & search) ─────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: raksha-opensearch
    restart: unless-stopped
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raksha-net

  # ─── Fluentd (SIEM Log Forwarder) ─────────────────────────────────────
  # Optional: Enable with SIEM_ENABLED=true
  fluentd:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.fluentd
    image: raksha/fluentd:${RAKSHA_VERSION:-latest}
    container_name: raksha-fluentd
    restart: unless-stopped
    ports:
      - "24224:24224"
      - "24224:24224/udp"
      - "24231:24231"
    environment:
      <<: *siem-env
      RAKSHA_ENVIRONMENT: ${RAKSHA__APP__ENVIRONMENT:-production}
      SIEM_USER: ${SIEM_USER:-}
      SPLUNK_INDEX: ${SPLUNK_INDEX:-raksha_security}
      SYSLOG_PROTOCOL: ${SYSLOG_PROTOCOL:-tcp}
      GELF_PROTOCOL: ${GELF_PROTOCOL:-udp}
    volumes:
      - fluentd-buffer:/fluentd/buffer
      - fluentd-pos:/fluentd/pos
      - ./deploy/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:24231/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - raksha-net
    profiles:
      - siem

  # ─── Grafana (Metrics Visualization) ──────────────────────────────────
  # Optional: Enable with --profile monitoring
  grafana:
    image: grafana/grafana:10.3.1
    container_name: raksha-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raksha-net
    profiles:
      - monitoring

  # ─── Prometheus (Metrics Collection) ──────────────────────────────────
  # Optional: Enable with --profile monitoring
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: raksha-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - raksha-net
    profiles:
      - monitoring

volumes:
  postgres-data:
  redis-data:
  timescale-data:
  opensearch-data:
  ml-models:
  fluentd-buffer:
  fluentd-pos:
  grafana-data:
  prometheus-data:

networks:
  raksha-net:
    driver: bridge

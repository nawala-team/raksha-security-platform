[package]
name = "raksha-cli"
version = "1.3.0"
edition = "2021"
description = "Raksha Security Platform - CLI Management Tool"
license = "MIT"

[[bin]]
name = "raksha"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabled = "0.15"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
toml = "0.8"

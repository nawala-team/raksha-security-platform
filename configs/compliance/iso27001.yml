# Raksha Security Platform - ISO 27001:2022 Controls Mapping
---
metadata:
  framework: ISO/IEC 27001:2022
  version: "2022"
  last_updated: "2024-03-15"
  description: Information security management system controls mapping
  total_controls: 93
  categories:
    - organizational (37 controls)
    - people (8 controls)
    - physical (14 controls)
    - technological (34 controls)

controls:
  # --- Annex A.5: Organizational Controls ---
  - id: A.5.1
    title: Policies for information security
    category: organizational
    raksha_mapping:
      automated_checks:
        - policy_document_exists
        - policy_review_date_current
        - policy_approval_recorded
      data_sources: [document_management_system, governance_platform]

  - id: A.5.2
    title: Information security roles and responsibilities
    category: organizational
    raksha_mapping:
      automated_checks:
        - rbac_configuration_valid
        - security_roles_assigned
      data_sources: [iam_system, hr_system]

  - id: A.5.7
    title: Threat intelligence
    category: organizational
    raksha_mapping:
      automated_checks:
        - threat_feeds_active
        - ioc_database_current
      integration: [feeds.nvd, feeds.mitre_attack, feeds.abuse_ch, feeds.otx, feeds.cisa_kev]

  - id: A.5.23
    title: Information security for cloud services
    category: organizational
    raksha_mapping:
      automated_checks:
        - cloud_security_posture
        - cloud_configuration_baseline
      data_sources: [cloud_security_scanner]

  - id: A.5.24
    title: Incident management planning

  # --- Annex A.6: People Controls ---
  - id: A.6.1
    title: Screening
    category: people
    raksha_mapping:
      automated_checks: [screening_records_complete]
      data_sources: [hr_system]

  - id: A.6.3
    title: Information security awareness and training
    category: people
    raksha_mapping:
      automated_checks:
        - training_completion_rate
        - phishing_simulation_results
      data_sources: [lms_platform, phishing_simulator]
      thresholds:
        training_completion: 95
        phishing_click_rate_max: 5

  # --- Annex A.7: Physical Controls ---
  - id: A.7.1
    title: Physical security perimeters
    category: physical
    raksha_mapping:
      automated_checks:
        - access_control_logs_monitored
        - perimeter_breach_alerts_active
      data_sources: [physical_access_system, cctv_system]

  # --- Annex A.8: Technological Controls ---
  - id: A.8.1
    title: User endpoint devices
    category: technological
    raksha_mapping:
      automated_checks:
        - endpoint_encryption_enabled
        - edr_agent_running
        - os_patch_current
      rules: [raksha-mal-004, raksha-mal-005]

  - id: A.8.5
    title: Secure authentication
    category: technological
    raksha_mapping:
      automated_checks:
        - mfa_enforced
        - password_policy_compliant
        - brute_force_protection_active
      rules: [raksha-bf-001, raksha-bf-002, raksha-bf-003]

  - id: A.8.7
    title: Protection against malware
    category: technological
    raksha_mapping:
      automated_checks:
        - antimalware_deployed
        - behavioral_detection_active
      rules: [raksha-mal-001, raksha-mal-002, raksha-mal-003]

  - id: A.8.12
    title: Data leakage prevention
    category: technological
    raksha_mapping:
      automated_checks:
        - dlp_policies_active
        - exfiltration_monitoring_active
      rules: [raksha-exfil-001, raksha-exfil-002, raksha-exfil-003, raksha-exfil-005]

  - id: A.8.15
    title: Logging
    category: technological
    raksha_mapping:
      automated_checks:
        - centralized_logging_active
        - log_integrity_verified
        - log_retention_compliant

  - id: A.8.16
    title: Monitoring activities
    category: technological
    raksha_mapping:
      automated_checks:
        - siem_operational
        - anomaly_detection_active
        - alert_response_sla_met
      integration: [anomaly_detector, network_analyzer, user_behavior]

  - id: A.8.20
    title: Networks security
    category: technological
    raksha_mapping:
      automated_checks:
        - network_segmentation_verified
        - firewall_rules_reviewed
        - ids_ips_active
      rules: [raksha-ps-001, raksha-ps-002, raksha-ps-004]

  - id: A.8.28
    title: Secure coding
    category: technological
    raksha_mapping:
      automated_checks:
        - sast_scan_passing
        - dependency_vulnerabilities_resolved
        - code_review_completed

scoring:
  compliance_levels:
    - level: 0
      name: Non-existent
    - level: 1
      name: Initial
    - level: 2
      name: Managed
    - level: 3
      name: Defined
    - level: 4
      name: Quantitatively Managed
    - level: 5
      name: Optimizing

    category: organizational
    raksha_mapping:
      automated_checks:
        - incident_response_plan_exists
        - ir_playbooks_tested
        - escalation_paths_defined

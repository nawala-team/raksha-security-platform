apiVersion: v2
name: raksha-platform
description: Raksha Security Platform - Unified SIEM, EDR, and Compliance
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - security
  - siem
  - edr
  - compliance
  - monitoring
home: https://github.com/raksha-security/raksha-platform
sources:
  - https://github.com/raksha-security/raksha-platform
maintainers:
  - name: Raksha Security Team
    url: https://github.com/raksha-security
icon: https://raw.githubusercontent.com/raksha-security/raksha-platform/main/docs/logo.svg
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

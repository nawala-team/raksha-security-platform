# ─── Raksha Security Platform - Fluentd Configuration ────────────────────────
# Reads logs from Raksha portal and forwards to configured SIEM target.
# Environment variables control routing: SIEM_TARGET, SIEM_HOST, SIEM_PORT, etc.

# ─── Source: Forward input from Raksha services ──────────────────────────────
<source>
  @type forward
  port 24224
  bind 0.0.0.0
  tag raksha.*
</source>

# ─── Source: Prometheus metrics endpoint ─────────────────────────────────────
<source>
  @type prometheus
  port 24231
  bind 0.0.0.0
  metrics_path /metrics
</source>

<source>
  @type prometheus_monitor
</source>

# ─── Filter: Parse JSON structured logs from Raksha portal ───────────────────
<filter raksha.portal.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field false
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S%.NZ
  </parse>
</filter>

# ─── Filter: Add metadata fields ────────────────────────────────────────────
<filter raksha.**>
  @type record_transformer
  enable_ruby true
  <record>
    platform "raksha-security"
    environment "#{ENV['RAKSHA_ENVIRONMENT'] || 'production'}"
    hostname "#{Socket.gethostname}"
    siem_format "#{ENV['SIEM_FORMAT'] || 'cef'}"
  </record>
</filter>

# ─── Filter: CEF formatting for events ──────────────────────────────────────
<filter raksha.portal.security.**>
  @type record_transformer
  enable_ruby true
  <record>
    cef_header "CEF:0|Raksha|SecurityPlatform|1.0|${record['event_type'] || 'GENERIC'}|${record['message'] || 'Security Event'}|${record['severity'] || 5}|"
    cef_extension "src=${record['source_ip'] || ''} dst=${record['dest_ip'] || ''} act=${record['action'] || ''} duser=${record['user'] || ''} msg=${record['message'] || ''}"
  </record>
</filter>

# ─── Tag rewrite based on SIEM target ───────────────────────────────────────
<match raksha.**>
  @type rewrite_tag_filter
  <rule>
    key siem_format
    pattern /^(.+)$/
    tag siem.${tag}
  </rule>
</match>

# ─── Output: Splunk HEC ─────────────────────────────────────────────────────
<match siem.raksha.**>
  @type copy

  # Splunk HEC output (enabled when SIEM_TARGET=splunk)
  <store>
    @type splunk_hec
    host "#{ENV['SIEM_HOST']}"
    port "#{ENV['SIEM_PORT'] || '8088'}"
    token "#{ENV['SIEM_TOKEN']}"
    use_ssl "#{ENV['SIEM_TLS_ENABLED'] || 'true'}"
    ssl_verify "#{ENV['SIEM_TLS_VERIFY'] || 'true'}"

    index "#{ENV['SPLUNK_INDEX'] || 'raksha_security'}"
    source raksha-platform
    sourcetype _json

    <buffer>
      @type file
      path /fluentd/buffer/splunk
      flush_interval "#{ENV['SIEM_FLUSH_INTERVAL'] || '5s'}"
      chunk_limit_size "#{ENV['SIEM_BUFFER_SIZE'] || '256'}m"
      retry_max_times 5
      retry_wait 10s
      overflow_action drop_oldest_chunk
    </buffer>

    @label @SPLUNK
  </store>

  # Elasticsearch/OpenSearch output (enabled when SIEM_TARGET=elasticsearch)
  <store>
    @type elasticsearch
    host "#{ENV['SIEM_HOST']}"
    port "#{ENV['SIEM_PORT'] || '9200'}"
    user "#{ENV['SIEM_USER'] || ''}"
    password "#{ENV['SIEM_TOKEN']}"
    scheme "#{ENV['SIEM_TLS_ENABLED'] == 'true' ? 'https' : 'http'}"
    ssl_verify "#{ENV['SIEM_TLS_VERIFY'] || 'true'}"

    index_name raksha-security-%Y.%m.%d
    type_name _doc

    <buffer tag, time>
      @type file
      path /fluentd/buffer/elasticsearch
      timekey 1h
      timekey_wait 10m
      flush_interval "#{ENV['SIEM_FLUSH_INTERVAL'] || '5s'}"
      chunk_limit_size 8m
      retry_max_times 5
    </buffer>

    @label @ELASTICSEARCH
  </store>

  # Syslog/CEF output (enabled when SIEM_TARGET=syslog)
  <store>
    @type remote_syslog
    host "#{ENV['SIEM_HOST']}"
    port "#{ENV['SIEM_PORT'] || '514'}"
    protocol "#{ENV['SYSLOG_PROTOCOL'] || 'tcp'}"
    severity info
    facility local0
    tag raksha

    <buffer>
      @type file
      path /fluentd/buffer/syslog
      flush_interval "#{ENV['SIEM_FLUSH_INTERVAL'] || '5s'}"
    </buffer>

    @label @SYSLOG
  </store>

  # Graylog/GELF output (enabled when SIEM_TARGET=graylog)
  <store>
    @type gelf
    host "#{ENV['SIEM_HOST']}"
    port "#{ENV['SIEM_PORT'] || '12201'}"
    protocol "#{ENV['GELF_PROTOCOL'] || 'udp'}"

    <buffer>
      @type file
      path /fluentd/buffer/graylog
      flush_interval "#{ENV['SIEM_FLUSH_INTERVAL'] || '5s'}"
    </buffer>

    @label @GRAYLOG
  </store>
</match>

# ─── Fallback: stdout for debugging ─────────────────────────────────────────
<label @ERROR>
  <match **>
    @type stdout
    <format>
      @type json
    </format>
  </match>
</label>

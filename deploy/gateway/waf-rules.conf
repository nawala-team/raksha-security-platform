# =============================================================================
# Raksha Security Platform - ModSecurity WAF Rules
# =============================================================================
# Custom rules complementing OWASP CRS. Rule IDs: 100000-109999

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog /var/log/modsec/audit.log
SecAuditLogFormat JSON
SecAuditLogType Serial

SecTmpDir /tmp/modsec/tmp
SecDataDir /tmp/modsec/data

SecDefaultAction "phase:2,deny,status:403,log,auditlog"

# =============================================================================
# SQL Injection Detection (100000-100099)
# =============================================================================

SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?i:(?:union\s+(?:all\s+)?select|select\s+.*\s+from|insert\s+into|update\s+.*\s+set|delete\s+from|drop\s+(?:table|database)|alter\s+table|truncate\s+table))" \
    "id:100000,phase:2,deny,status:403,msg:'SQL Injection (keyword)',tag:'attack-sqli',severity:'CRITICAL'"

SecRule ARGS|REQUEST_BODY "@rx (?i:(?:\/\*.*?\*\/|--\s|#\s|;\s*(?:drop|alter|create|insert|update|delete|exec)))" \
    "id:100001,phase:2,deny,status:403,msg:'SQL Injection via Comment/Chain',tag:'attack-sqli',severity:'CRITICAL'"

SecRule ARGS|REQUEST_BODY "@rx (?i:(?:concat\s*\(|char\s*\(|ascii\s*\(|substring\s*\(|benchmark\s*\(|sleep\s*\(|waitfor\s+delay|pg_sleep))" \
    "id:100002,phase:2,deny,status:403,msg:'SQL Injection via Function',tag:'attack-sqli',severity:'HIGH'"

SecRule ARGS|REQUEST_BODY "@rx (?i:(?:\'\s*(?:or|and)\s*[\'\d]|(?:or|and)\s+\d+\s*=\s*\d+))" \
    "id:100003,phase:2,deny,status:403,msg:'Blind SQL Injection',tag:'attack-sqli',severity:'HIGH'"

SecRule ARGS|REQUEST_BODY "@rx (?i:(?:sleep\s*\(\s*\d|benchmark\s*\(\s*\d|pg_sleep\s*\(\s*\d|waitfor\s+delay\s+['\"]))" \
    "id:100004,phase:2,deny,status:403,msg:'Time-Based Blind SQLi',tag:'attack-sqli',severity:'CRITICAL'"

# =============================================================================
# XSS Prevention (100100-100199)
# =============================================================================

SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?i:<script[^>]*>|<\/script>|javascript\s*:|vbscript\s*:|on(?:load|error|click|mouse|focus|blur|change|submit)\s*=)" \
    "id:100100,phase:2,deny,status:403,msg:'XSS (script/event handler)',tag:'attack-xss',severity:'CRITICAL'"

SecRule ARGS|REQUEST_BODY "@rx (?i:(?:data\s*:\s*text\/html|data\s*:\s*image\/svg\+xml))" \
    "id:100101,phase:2,deny,status:403,msg:'XSS via Data URI',tag:'attack-xss',severity:'HIGH'"

SecRule ARGS|REQUEST_BODY "@rx (?i:<svg[^>]*on\w+\s*=|<(?:embed|object|applet|iframe|frame)\s)" \
    "id:100102,phase:2,deny,status:403,msg:'XSS via HTML Injection',tag:'attack-xss',severity:'HIGH'"

SecRule ARGS|REQUEST_BODY "@rx (?i:(?:expression\s*\(|@import\s|moz-binding\s*:))" \
    "id:100103,phase:2,deny,status:403,msg:'XSS via CSS Expression',tag:'attack-xss',severity:'MEDIUM'"

# =============================================================================
# Path Traversal Blocking (100200-100299)
# =============================================================================

SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?:(?:\.{2}[\/\\]){1,}|(?:%2e%2e[%2f%5c]){1,})" \
    "id:100200,phase:2,deny,status:403,msg:'Path Traversal',tag:'attack-lfi',severity:'CRITICAL'"

SecRule REQUEST_URI "@rx (?i:(?:\/etc\/(?:passwd|shadow|hosts)|\/proc\/(?:self|version)|\.(?:htaccess|htpasswd|env|git)))" \
    "id:100201,phase:1,deny,status:403,msg:'Sensitive File Access',tag:'attack-lfi',severity:'CRITICAL'"

SecRule REQUEST_URI|ARGS "@rx (?i:(?:[a-z]:\\\\|\\\\\\\\|boot\.ini|win\.ini|system32|cmd\.exe|powershell))" \
    "id:100202,phase:2,deny,status:403,msg:'Windows Path Traversal',tag:'attack-lfi',severity:'HIGH'"

SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?:%00|\\x00)" \
    "id:100203,phase:2,deny,status:403,msg:'Null Byte Injection',tag:'attack-lfi',severity:'CRITICAL'"

# =============================================================================
# Command Injection Blocking (100300-100399)
# =============================================================================

SecRule ARGS|REQUEST_BODY "@rx (?:(?:;|\||&&|\|\||`)\s*(?:cat|ls|dir|id|whoami|uname|pwd|wget|curl|nc|bash|sh|cmd|powershell|python|perl))" \
    "id:100300,phase:2,deny,status:403,msg:'OS Command Injection',tag:'attack-rce',severity:'CRITICAL'"

SecRule ARGS|REQUEST_BODY "@rx (?:`[^`]*`|\$\([^)]*\)|\$\{[^}]*\})" \
    "id:100301,phase:2,deny,status:403,msg:'Command Injection via Subshell',tag:'attack-rce',severity:'CRITICAL'"

SecRule ARGS|REQUEST_BODY "@rx (?i:(?:\/bin\/(?:bash|sh|zsh)|cmd\.exe|powershell\.exe|eval\s*\(|exec\s*\(|system\s*\(|passthru\s*\(|popen\s*\())" \
    "id:100302,phase:2,deny,status:403,msg:'Exploitation Command Detected',tag:'attack-rce',severity:'CRITICAL'"

SecRule ARGS|REQUEST_BODY "@rx (?i:(?:\/dev\/tcp\/|mkfifo|nc\s+-[elp]|bash\s+-i|python\s+-c\s+['\"]import\s+(?:socket|os)))" \
    "id:100303,phase:2,deny,status:403,msg:'Reverse Shell Attempt',tag:'attack-rce',severity:'CRITICAL'"

# =============================================================================
# Rate Limiting (100500-100599)
# =============================================================================

SecAction "id:100500,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR},setvar:ip.request_count=+1,expirevar:ip.request_count=60"

SecRule IP:REQUEST_COUNT "@gt 300" \
    "id:100501,phase:1,deny,status:429,msg:'Rate Limit Exceeded (300/min)',tag:'rate-limit',severity:'MEDIUM'"

# =============================================================================
# Allowlists (109000-109099)
# =============================================================================

SecRule REQUEST_URI "@beginsWith /api/v1/agents/heartbeat" \
    "id:109000,phase:1,pass,nolog,ctl:ruleRemoveById=100000-100399"

SecRule REQUEST_URI "@streq /health" \
    "id:109001,phase:1,pass,nolog,ctl:ruleEngine=Off"

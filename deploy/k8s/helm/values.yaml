## Raksha Security Platform - Helm Values
## =========================================

global:
  imageRegistry: ghcr.io/raksha-security
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: raksha-registry-creds

## Portal API Server
portal:
  replicaCount: 3
  image:
    repository: raksha-portal
    tag: "1.0.0"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8443
  env:
    LOG_LEVEL: info
    DATABASE_POOL_SIZE: "20"
    REDIS_URL: redis://raksha-redis:6379
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8443
      scheme: HTTPS
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8443
      scheme: HTTPS
    initialDelaySeconds: 5
    periodSeconds: 10
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

## Web Dashboard
web:
  replicaCount: 2
  image:
    repository: raksha-web
    tag: "1.0.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 3000

## ML Threat Engine
ml:
  replicaCount: 2
  image:
    repository: raksha-ml-engine
    tag: "1.0.0"
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
      nvidia.com/gpu: "1"
  service:
    type: ClusterIP
    port: 8080
  env:
    MODEL_PATH: /models/threat-detection
    BATCH_SIZE: "32"
    INFERENCE_TIMEOUT: "5000"

## Admission Webhook
admissionWebhook:
  enabled: true
  replicaCount: 2
  image:
    repository: raksha-admission-webhook
    tag: "1.0.0"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 443
  tls:
    certManager: true
    issuerRef:
      name: raksha-ca-issuer
      kind: ClusterIssuer
  failurePolicy: Fail
  namespaceSelector:
    matchExpressions:
      - key: raksha.security/enforce
        operator: In
        values: ["true"]

## Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit-rps: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
  hosts:
    - host: portal.raksha.security
      paths:
        - path: /api
          pathType: Prefix
          service: portal
        - path: /
          pathType: Prefix
          service: web
  tls:
    - secretName: raksha-tls
      hosts:
        - portal.raksha.security

## Persistence
persistence:
  models:
    enabled: true
    storageClass: gp3
    accessMode: ReadWriteOnce
    size: 50Gi
  data:
    enabled: true
    storageClass: gp3
    accessMode: ReadWriteOnce
    size: 100Gi
  logs:
    enabled: true
    storageClass: gp3
    accessMode: ReadWriteMany
    size: 200Gi

## PostgreSQL (subchart)
postgresql:
  enabled: true
  auth:
    existingSecret: raksha-db-credentials
    database: raksha
  primary:
    persistence:
      size: 50Gi
      storageClass: gp3

## Redis (subchart)
redis:
  enabled: true
  auth:
    existingSecret: raksha-redis-credentials
  architecture: replication
  replica:
    replicaCount: 3

## Security Context Defaults
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

## Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

## Network Policies
networkPolicy:
  enabled: true

## Service Monitor (Prometheus)
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

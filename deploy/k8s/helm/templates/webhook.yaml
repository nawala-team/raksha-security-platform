{{- if .Values.admissionWebhook.enabled -}}
{{- $fullName := include "raksha.fullname" . -}}
{{- $labels := include "raksha.labels" . -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullName }}-pod-security
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $fullName }}-webhook-tls
webhooks:
  - name: pod-security.raksha.security
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 10
    failurePolicy: {{ .Values.admissionWebhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $fullName }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
        scope: Namespaced
    {{- with .Values.admissionWebhook.namespaceSelector }}
    namespaceSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  - name: image-policy.raksha.security
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 10
    failurePolicy: {{ .Values.admissionWebhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $fullName }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-image
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
    {{- with .Values.admissionWebhook.namespaceSelector }}
    namespaceSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}

{{- if .Values.ingress.enabled -}}
{{- $fullName := include "raksha.fullname" . -}}
{{- $labels := include "raksha.labels" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "portal" }}
                name: {{ $fullName }}-portal
                port:
                  number: 8443
                {{- else if eq .service "web" }}
                name: {{ $fullName }}-web
                port:
                  number: 3000
                {{- else if eq .service "ml" }}
                name: {{ $fullName }}-ml
                port:
                  number: 8080
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
